<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Vẽ ảnh xem trước</title>
  <!-- Công cụ nội bộ: vẽ ảnh og/<mã>.png (1200x630) cho thẻ xem trước Zalo / Messenger.
       Mở qua server local có endpoint POST /__save (xem hướng dẫn trong tools/tao-link-ngan.js). -->
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Charm:wght@700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; background: #e8f4fd; padding: 16px; }
    canvas { width: 600px; max-width: 100%; display: block; margin: 12px 0; border-radius: 12px; }
  </style>
</head>
<body>
  <p id="status">Đang vẽ…</p>
  <div id="out"></div>
  <script>
    const W = 1200, H = 630;

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }

    function fitText(ctx, text, maxW, size, font) {
      let s = size;
      do { ctx.font = font.replace('{s}', s); s -= 2; } while (ctx.measureText(text).width > maxW && s > 20);
    }

    function draw(item, logo) {
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const ctx = c.getContext('2d');

      // Nền xanh HCMOU + chấm bi
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#002855'); g.addColorStop(0.55, '#003D7A'); g.addColorStop(1, '#0052A3');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      for (let x = 12; x < W; x += 28) for (let y = 12; y < H; y += 28) { ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }
      // mây mờ
      ctx.fillStyle = 'rgba(186,224,253,0.18)';
      ctx.beginPath(); ctx.arc(80, 560, 170, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(1130, 70, 150, 0, 7); ctx.fill();

      // Thẻ trắng ở giữa
      const cx = 90, cy = 60, cw = W - 180, ch = H - 120;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
      roundRect(ctx, cx, cy, cw, ch, 36); ctx.fillStyle = '#F6FAFD'; ctx.fill(); ctx.restore();
      roundRect(ctx, cx + 10, cy + 10, cw - 20, ch - 20, 28); ctx.strokeStyle = '#BAE0FD'; ctx.lineWidth = 3; ctx.stroke();

      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      const mid = W / 2;

      // Logo trường
      if (logo) {
        const lh = 64, lw = logo.width * lh / logo.height;
        ctx.drawImage(logo, mid - lw / 2, cy + 34, lw, lh);
      }

      ctx.fillStyle = '#4A6B82'; ctx.font = '600 22px "Be Vietnam Pro"';
      ctx.fillText('TRƯỜNG ĐẠI HỌC MỞ TP. HỒ CHÍ MINH', mid, cy + 130);
      ctx.fillStyle = '#003D7A'; ctx.font = '800 40px Montserrat';
      ctx.fillText('THƯ MỜI LỄ TỐT NGHIỆP', mid, cy + 182);

      // Người nhận (to, nổi bật)
      ctx.fillStyle = '#0052A3';
      fitText(ctx, item.greet, cw - 120, 78, '700 {s}px Charm');
      ctx.fillText(item.greet, mid, cy + 282);

      ctx.fillStyle = '#334155'; ctx.font = '600 28px "Be Vietnam Pro"';
      ctx.fillText('từ Nguyễn Thị Bích Phượng  •  Ngành Ngôn ngữ Anh', mid, cy + 336);

      // Ô ngày giờ
      const pill = 'Chủ Nhật, 22/11/2026  •  ' + item.imgTime;
      ctx.font = '700 28px "Be Vietnam Pro"';
      const pw = ctx.measureText(pill).width + 70, ph = 64, py = cy + 372;
      roundRect(ctx, mid - pw / 2, py, pw, ph, 32); ctx.fillStyle = '#003D7A'; ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillText(pill, mid, py + 42);

      ctx.fillStyle = '#e11d48'; ctx.font = '700 26px "Be Vietnam Pro"';
      ctx.fillText('👆 Chạm vào đây để mở thiệp ♡', mid, cy + ch - 34);
      return c;
    }

    (async () => {
      await document.fonts.load('700 40px Charm');
      await document.fonts.load('800 40px Montserrat');
      await document.fonts.load('600 20px "Be Vietnam Pro"');
      await document.fonts.load('700 20px "Be Vietnam Pro"');
      await document.fonts.ready;
      const logo = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = '../logo-truong.png'; });
      const only = new URLSearchParams(location.search).get('only'); // ?only=<mã> để chỉ vẽ 1 người
      const list = (await (await fetch('og-recipients.json?v=' + Date.now())).json()).filter(i => !only || i.slug === only);
      const out = document.getElementById('out');
      let saved = 0;
      for (const item of list) {
        const c = draw(item, logo);
        out.appendChild(c);
        const blob = await new Promise(r => c.toBlob(r, 'image/png'));
        const res = await fetch('/__save?name=' + encodeURIComponent(item.slug), { method: 'POST', body: blob }).catch(() => null);
        if (res && res.ok) saved++;
      }
      document.getElementById('status').textContent = `Đã vẽ ${list.length} ảnh, đã lưu ${saved} ảnh vào og/`;
    })();
  </script>
</body>
</html>
